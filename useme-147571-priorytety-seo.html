<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Karta decyzji dla audytu SEO · CloudCode Studio</title><style>:root{font-family:system-ui,sans-serif;color:#172320;background:#f3f3ed;color-scheme:light}*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:auto;padding:42px 20px 72px}h1{font-size:clamp(2.25rem,6vw,4.3rem);line-height:1.04;letter-spacing:-.05em;margin:10px 0 22px;max-width:850px}p{line-height:1.6}.eyebrow{color:#356459;font-weight:700;letter-spacing:.075em;font-size:.86rem}.panel{padding:24px;margin-top:24px;border:1px solid #c9d2c7;background:#fff;border-radius:14px}label{display:block;margin:10px 0 6px;font-weight:650}input,select,button{font:inherit}input:not([type=checkbox]),select{width:100%;padding:10px;border:1px solid #9aada2;border-radius:6px}button{padding:10px 15px;background:#233f35;color:white;border:0;border-radius:6px;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #bf7613;outline-offset:2px}.row{display:grid;grid-template-columns:1fr 1fr;gap:22px}.result{background:#edf1e7;padding:14px;border-left:4px solid #3b6b56;line-height:1.5;overflow-wrap:anywhere}.muted{color:#526860;font-size:.94rem}a{color:#1a5a43}ul{padding-left:21px}li{margin:.45em 0}output{display:block;margin:14px 0;white-space:pre-wrap}canvas{display:block;width:100%;max-width:580px;margin:10px auto;background:repeating-conic-gradient(#f0f0ea 0 25%,#e6eee8 0 50%) 50%/26px 26px;border-radius:12px}article{padding:24px;background:#172b24;color:#f2eddc;border-radius:12px;overflow-wrap:anywhere}article h2{margin:0 0 10px}@media(max-width:640px){.row{grid-template-columns:1fr}.panel{padding:15px}main{padding:28px 14px 52px}}@media print{main{padding:0}.skip-print{display:none}.panel{break-inside:avoid}}</style></head>
<body><main><div class="eyebrow">CLOUDCODE STUDIO · PRZYKŁAD AUTORSKI</div><h1>Karta decyzji dla audytu SEO</h1><p>Próbka raportu na fikcyjnych danych pokazuje kolejność prac. Każde zalecenie z audytu opisuje adres, zaobserwowany objaw, dowód i ponowny test.</p><section class="panel"><div class="row"><div><label for="symptom">Co wykazała kontrola?</label><select id="symptom"><option value="index">Ważna podstrona wykluczona z indeksu</option><option value="redirect">Przekierowanie do niewłaściwej podstrony</option><option value="links">Słabe linkowanie do strony usługi</option><option value="ctr">Wyświetlenia bez kliknięć</option></select></div><div><label for="scale">Ile kluczowych podstron dotyczy?</label><input id="scale" type="number" min="1" max="500" value="3"></div></div><output id="decision" class="result" aria-live="polite"></output></section><section class="panel"><h2>Przykład wcześniejszego warsztatu</h2><p><a href="https://soliddigitalpolska-create.github.io/solid-digital-probki250-13/makiety-27-10-fala5/audyt-seo-20-adresow-mapa-fraz/">Mapa audytu adresów i fraz</a></p></section></main><script>
'use strict';
const sel=document.getElementById('symptom'),count=document.getElementById('scale'),dec=document.getElementById('decision');
const evidence={index:['P1','Sprawdź deklarowany i wybrany canonical, meta robots oraz status w Inspekcji URL.','Po zmianie sprawdź odpowiedź HTTP, canonical i powtórz inspekcję indeksowania.'],redirect:['P1','Zapisz łańcuch przekierowań i docelową odpowiedź HTTP.','Powtórz żądanie dla starego adresu i sprawdź poprawny adres docelowy.'],links:['P2','Sprawdź liczbę kliknięć potrzebną do wejścia i naturalne odnośniki z powiązanych stron.','Po wdrożeniu powtórz przejście z nawigacji i zweryfikuj widoczność linku.'],ctr:['P2','Porównaj zapytania, CTR i pozycję w tym samym przedziale względem wcześniejszego okresu.','Powtórz pomiar po zebraniu porównywalnych danych.']};
function render(){if(!count.value||!count.checkValidity()){dec.value='Wpisz od 1 do 500 adresów.';return;}const [priority,proof,verify]=evidence[sel.value];dec.value=priority+' • '+count.value+' adresów\nDowód: '+proof+'\nOdbiór: '+verify;}sel.onchange=count.oninput=render;render();
</script></body></html>
