<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="Specyfikacja nie podejmuje decyzji. Zastosowanie, ograniczenie, dowód."><title>Specyfikacja nie podejmuje decyzji. Zastosowanie, ograniczenie, dowód.</title><rect x="0" y="0" width="1080" height="1350" fill="#172b38" rx="0"/><text x="76" y="90" fill="#f5f1e8" font-family="Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="1.6">ADDVEN / KONCEPCJA REDAKCYJNA</text><rect x="76" y="142" width="108" height="9" fill="#ed6b3e" rx="0"/><text x="70" y="285" fill="#f5f1e8" font-family="Arial, sans-serif" font-size="84" font-weight="700">SPECYFIKACJA</text><text x="70" y="388" fill="#f5f1e8" font-family="Arial, sans-serif" font-size="84" font-weight="700">NIE PODEJMUJE</text><text x="70" y="491" fill="#f5f1e8" font-family="Arial, sans-serif" font-size="84" font-weight="700">DECYZJI.</text><text x="76" y="585" fill="#c9d4d7" font-family="Arial, sans-serif" font-size="37" font-weight="400">Najpierw zadanie. Potem parametry.</text><rect x="76" y="660" width="928" height="130" fill="#223d4c" rx="12"/><text x="105" y="738" fill="#ed6b3e" font-family="Arial, sans-serif" font-size="49" font-weight="700">01</text><text x="214" y="709" fill="#b5c6cd" font-family="Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="1.2">ZASTOSOWANIE</text><text x="214" y="759" fill="#f5f1e8" font-family="Arial, sans-serif" font-size="37" font-weight="700">Co ma być łatwiejsze?</text><rect x="76" y="813" width="928" height="130" fill="#223d4c" rx="12"/><text x="105" y="891" fill="#ed6b3e" font-family="Arial, sans-serif" font-size="49" font-weight="700">02</text><text x="214" y="862" fill="#b5c6cd" font-family="Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="1.2">OGRANICZENIE</text><text x="214" y="912" fill="#f5f1e8" font-family="Arial, sans-serif" font-size="37" font-weight="700">Czego nie możesz zmienić?</text><rect x="76" y="966" width="928" height="130" fill="#223d4c" rx="12"/><text x="105" y="1044" fill="#ed6b3e" font-family="Arial, sans-serif" font-size="49" font-weight="700">03</text><text x="214" y="1015" fill="#b5c6cd" font-family="Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="1.2">DOWÓD</text><text x="214" y="1065" fill="#f5f1e8" font-family="Arial, sans-serif" font-size="37" font-weight="700">Co sprawdzisz przed wyborem?</text><rect x="76" y="1183" width="928" height="2" fill="#41535d" rx="0"/><text x="76" y="1234" fill="#a8bac2" font-family="Arial, sans-serif" font-size="26" font-weight="400">Autorska próbka / niewdrożona</text><text x="76" y="1273" fill="#a8bac2" font-family="Arial, sans-serif" font-size="26" font-weight="400">Układ i treści do oceny — bez deklaracji wyników.</text></svg>