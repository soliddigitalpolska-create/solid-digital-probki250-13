<text x="540" y="947" font-family="Segoe UI" font-size="15" font-weight="700" fill="#173D32" letter-spacing="0">02</text>
<text x="540" y="1025" font-family="Georgia" font-size="30" font-weight="400" fill="#173D32" letter-spacing="0">Magazyn energii</text>
<text x="540" y="1072" font-family="Segoe UI" font-size="18" font-weight="400" fill="#173D32" letter-spacing="0">Energia dostępna wtedy,</text>
<text x="540" y="1100" font-family="Segoe UI" font-size="18" font-weight="400" fill="#173D32" letter-spacing="0">gdy firma jej potrzebuje.</text>
<line x1="859" y1="1163" x2="881" y2="1163" stroke="#173D32" stroke-width="2" stroke-linecap="round"/>
<line x1="874" y1="1156" x2="881" y2="1163" stroke="#173D32" stroke-width="2" stroke-linecap="round"/>
<line x1="874" y1="1170" x2="881" y2="1163" stroke="#173D32" stroke-width="2" stroke-linecap="round"/>
