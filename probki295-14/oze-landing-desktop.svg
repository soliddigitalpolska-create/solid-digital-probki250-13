<text x="100" y="1025" font-family="Georgia" font-size="30" font-weight="400" fill="#173D32" letter-spacing="0">Fotowoltaika</text>
<text x="100" y="1072" font-family="Segoe UI" font-size="18" font-weight="400" fill="#173D32" letter-spacing="0">Własne źródło energii.</text>
<text x="100" y="1100" font-family="Segoe UI" font-size="18" font-weight="400" fill="#173D32" letter-spacing="0">Projekt dopasowany do obiektu.</text>
