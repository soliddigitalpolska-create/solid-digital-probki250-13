<text x="866" y="645" font-family="Segoe UI" font-size="17" font-weight="400" fill="#173D32" letter-spacing="0">Jedna ścieżka. Jasne kolejne kroki.</text>
<line x1="72" y1="709" x2="1368" y2="709" stroke="#D4DDCF" stroke-width="1" stroke-linecap="round"/>
<text x="72" y="793" font-family="Georgia" font-size="42" font-weight="400" fill="#173D32" letter-spacing="0">Rozwiązania, które</text>
<text x="72" y="842" font-family="Georgia" font-size="42" font-weight="400" fill="#173D32" letter-spacing="0">pracują razem.</text>
<text x="805" y="798" font-family="Segoe UI" font-size="21" font-weight="700" fill="#173D32" letter-spacing="0">Najpierw potrzeby, potem technologia.</text>
<text x="805" y="836" font-family="Segoe UI" font-size="18" font-weight="400" fill="#52665A" letter-spacing="0">Łączymy decyzję o instalacji z planem jej finansowania.</text>
