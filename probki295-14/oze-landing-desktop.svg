<text x="980" y="947" font-family="Segoe UI" font-size="15" font-weight="700" fill="#173D32" letter-spacing="0">03</text>
<text x="980" y="1025" font-family="Georgia" font-size="30" font-weight="400" fill="#173D32" letter-spacing="0">Finansowanie</text>
<text x="980" y="1072" font-family="Segoe UI" font-size="18" font-weight="400" fill="#173D32" letter-spacing="0">Poznaj możliwe ścieżki</text>
<text x="980" y="1100" font-family="Segoe UI" font-size="18" font-weight="400" fill="#173D32" letter-spacing="0">i warunki rozpoczęcia projektu.</text>
<line x1="1299" y1="1163" x2="1321" y2="1163" stroke="#173D32" stroke-width="2" stroke-linecap="round"/>
<line x1="1314" y1="1156" x2="1321" y2="1163" stroke="#173D32" stroke-width="2" stroke-linecap="round"/>
<line x1="1314" y1="1170" x2="1321" y2="1163" stroke="#173D32" stroke-width="2" stroke-linecap="round"/>
<text x="72" y="1320" font-family="Georgia" font-size="44" font-weight="400" fill="#173D32" letter-spacing="0">Od pytania do planu.</text>
<text x="72" y="1367" font-family="Segoe UI" font-size="21" font-weight="400" fill="#52665A" letter-spacing="0">Prosta ścieżka współpracy, bez technicznego chaosu.</text>
<line x1="72" y1="1421" x2="477" y2="1421" stroke="#B7C8B3" stroke-width="2" stroke-linecap="round"/>
<text x="72" y="1470" font-family="Segoe UI" font-size="17" font-weight="700" fill="#173D32" letter-spacing="0">01</text>
<text x="72" y="1517" font-family="Segoe UI" font-size="24" font-weight="700" fill="#173D32" letter-spacing="0">Rozmawiamy</text>
<text x="72" y="1555" font-family="Segoe UI" font-size="19" font-weight="400" fill="#52665A" letter-spacing="0">Poznajemy obiekt, cele</text>
<text x="72" y="1583" font-family="Segoe UI" font-size="19" font-weight="400" fill="#52665A" letter-spacing="0">i sposób korzystania z energii.</text>
<line x1="512" y1="1421" x2="917" y2="1421" stroke="#B7C8B3" stroke-width="2" stroke-linecap="round"/>
<text x="512" y="1470" font-family="Segoe UI" font-size="17" font-weight="700" fill="#173D32" letter-spacing="0">02</text>
<text x="512" y="1517" font-family="Segoe UI" font-size="24" font-weight="700" fill="#173D32" letter-spacing="0">Porządkujemy opcje</text>
<text x="512" y="1555" font-family="Segoe UI" font-size="19" font-weight="400" fill="#52665A" letter-spacing="0">Dobieramy rozwiązania</text>
<text x="512" y="1583" font-family="Segoe UI" font-size="19" font-weight="400" fill="#52665A" letter-spacing="0">oraz możliwe finansowanie.</text>
<line x1="952" y1="1421" x2="1357" y2="1421" stroke="#B7C8B3" stroke-width="2" stroke-linecap="round"/>
<text x="952" y="1470" font-family="Segoe UI" font-size="17" font-weight="700" fill="#173D32" letter-spacing="0">03</text>
<text x="952" y="1517" font-family="Segoe UI" font-size="24" font-weight="700" fill="#173D32" letter-spacing="0">Ustalamy następny krok</text>
<text x="952" y="1555" font-family="Segoe UI" font-size="19" font-weight="400" fill="#52665A" letter-spacing="0">Wiesz, jakie materiały</text>
<text x="952" y="1583" font-family="Segoe UI" font-size="19" font-weight="400" fill="#52665A" letter-spacing="0">i decyzje są potrzebne.</text>
<rect x="72" y="1673" width="1296" height="230" rx="24" fill="#173D32"/>
<text x="118" y="1744" font-family="Georgia" font-size="40" font-weight="400" fill="#F8F8F1" letter-spacing="0">Zacznijmy od Twojej firmy.</text>
<text x="118" y="1798" font-family="Segoe UI" font-size="21" font-weight="400" fill="#D6E0CB" letter-spacing="0">Opowiedz o potrzebach. Ustalimy, co warto sprawdzić.</text>
